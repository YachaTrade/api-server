[package]
name = "api-server"
version = "1.0.0"
edition = "2024"

[features]
# Enables anvil-backed integration tests for chain::rpc_chain.
# Gated on resolving the tempfile version conflict (redis ^3.1 vs
# alloy-node-bindings ^3.20). Re-enable in Phase 3.
node-bindings = []

[dependencies]
# =====================================================
# Database
# =====================================================
# PostgreSQL database driver with async support
sqlx = { version = "0.8.1", features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls",
    "bigdecimal",
    "chrono",
    "json",
    "uuid",
    "macros",
    "migrate",
] }

# Redis cache and session store
redis = { version = "0.29.0", features = [
    "tokio-comp",
    "tokio-native-tls-comp",
    "json",
    "aio",
    "connection-manager",
] }

# =====================================================
# Async Runtime
# =====================================================
tokio = { version = "1.38.0", features = ["full"] }

# =====================================================
# Caching & Memory Management
# =====================================================
# In-memory cache with TTL support
moka = { version = "0.12", features = ["future"] }
# Thread-safe lazy static initialization
once_cell = "1.19"
lazy_static = "1.5.0"
# Binary serialization for cache
bincode = "1.3"
# High-performance read-write locks
parking_lot = "0.12"

# =====================================================
# Web Server & HTTP
# =====================================================
# Web framework
axum = { version = "0.7.5", features = ["multipart", "macros"] }
axum-server = { version = "0.6", features = ["tls-rustls"] }

# Middleware and utilities
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5.2", features = ["full"] }
tower_governor = "0.4.2"                                # Rate limiting
tower-sessions-core = "0.12.2"                          # Session management
tower-cookies = "0.10.0"                                # Cookie handling

# HTTP client
reqwest = { version = "0.12.15", features = ["multipart", "json"] }

# =====================================================
# API Documentation (Swagger/OpenAPI)
# =====================================================
utoipa = { version = "4.2.3", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum"] }

# =====================================================
# Blockchain (EVM)
# =====================================================
# Ethereum library for smart contract interaction
alloy = { version = "1.0.24", features = [
    "contract",
    "network",
    "providers",
    "rpc-types-eth",
    "signer-local",
    "sol-types",
] }
hex = "0.4"

# =====================================================
# Cloud Services (AWS)
# =====================================================
aws-config = "1.8.6"
aws-sdk-rekognition = "1.87.0" # Image moderation
aws-sdk-s3 = "1.105.0"         # Object storage

# =====================================================
# Image Processing
# =====================================================
image = "0.25.8"
resvg = "0.44.0"     # SVG rendering
tiny-skia = "0.11.4" # 2D graphics
usvg = "0.44.0"      # SVG parsing

# =====================================================
# Serialization & Data Formats
# =====================================================
serde = "1.0.203"
serde_json = "1.0.117"
bigdecimal = { version = "0.4.6", features = ["serde-json"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.8.0"

# =====================================================
# Utilities
# =====================================================
# Error handling
anyhow = "1.0.92"
async-trait = "0.1"
thiserror = "2"

# CLI argument parsing
clap = { version = "4.4.11", features = ["derive"] }

# Configuration
dotenv = "0.15.0"

# String processing
regex = "1.10.3"
url = "2.5.4"

# Random & UUID
uuid = { version = "1.11.0", features = ["serde", "v4"] }
rand = "0.8.5"

# Cryptography
sha2 = "0.10"  # SHA256 hashing for API keys

# Parallel processing
rayon = "1.10.0"

# =====================================================
# Logging & Observability
# =====================================================
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
    "time",
    "env-filter",
    "json",
    "registry",
    "ansi",
] }
utoipa-scalar = { version = "0.1", features = ["axum"] }
