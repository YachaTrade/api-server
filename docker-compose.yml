version: '3.8'

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8443:8443"
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    networks:
      - nads-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nadsadmin
      POSTGRES_PASSWORD: nadsadmin
      POSTGRES_DB: pump
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - nads-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nads-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nads-network:
    driver: bridge