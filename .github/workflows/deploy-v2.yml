name: Deploy to ECS - v2 Branch (Parallel)

on:
  push:
    branches:
      - v2
    paths:
      - '**'
      - '.github/workflows/deploy-v2.yml'

env:
  AWS_ACCOUNT_ID: 010928181973
  ECR_REPOSITORY: api
  ECS_SERVICE: api
  ECS_CLUSTER: api

jobs:
  build-and-deploy:
    name: Build and Deploy to All Regions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: 
          - name: Paris
            aws-region: eu-west-3
          - name: Ohio
            aws-region: us-east-2
          - name: Tokyo
            aws-region: ap-northeast-1
          - name: Singapore
            aws-region: ap-southeast-1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ matrix.region.aws-region }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Create ECR repository if not exists
      run: |
        aws ecr describe-repositories --repository-names ${ECR_REPOSITORY} --region ${{ matrix.region.aws-region }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${ECR_REPOSITORY} --region ${{ matrix.region.aws-region }}

    - name: Build, tag, and push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: v2-${{ github.run_number }}-${{ github.sha }}
      run: |
        # Build and push with buildx (supports caching)
        docker buildx build \
          --platform linux/amd64 \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:v2-latest \
          --push \
          --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache \
          --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache,mode=max \
          .

    - name: Update task definition and ECS service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: v2-${{ github.run_number }}-${{ github.sha }}
      run: |
        echo "Updating ECS service in ${{ matrix.region.name }} (${{ matrix.region.aws-region }})..."
        
        # Get current task definition
        TASK_DEFINITION=$(aws ecs describe-task-definition \
          --task-definition ${ECS_SERVICE} \
          --region ${{ matrix.region.aws-region }} \
          --query 'taskDefinition')
        
        # Update the image in container definition
        NEW_TASK_DEF=$(echo $TASK_DEFINITION | \
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn) | del(.revision) | del(.status) | del(.requiresAttributes) | del(.compatibilities) | del(.registeredAt) | del(.registeredBy)')
        
        # Register new task definition
        NEW_TASK_INFO=$(aws ecs register-task-definition \
          --cli-input-json "$NEW_TASK_DEF" \
          --region ${{ matrix.region.aws-region }})
        
        NEW_REVISION=$(echo $NEW_TASK_INFO | jq -r '.taskDefinition.revision')
        
        # Update service with new task definition
        aws ecs update-service \
          --cluster ${ECS_CLUSTER} \
          --service ${ECS_SERVICE} \
          --task-definition ${ECS_SERVICE}:${NEW_REVISION} \
          --region ${{ matrix.region.aws-region }}
        
        # Wait for deployment to stabilize (with timeout)
        timeout 15m aws ecs wait services-stable \
          --cluster ${ECS_CLUSTER} \
          --services ${ECS_SERVICE} \
          --region ${{ matrix.region.aws-region }} || {
            echo "::warning::Deployment to ${{ matrix.region.name }} is taking longer than expected"
            exit 0
          }
        
        echo "✅ Deployment to ${{ matrix.region.name }} completed successfully"

  summary:
    name: Deployment Summary
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Create deployment summary
      uses: actions/github-script@v7
      with:
        script: |
          const deployments = ${{ toJSON(needs.build-and-deploy) }};
          const timestamp = new Date().toISOString();
          
          let summary = `## 🚀 Deployment Summary\n\n`;
          summary += `**Branch:** v2\n`;
          summary += `**Commit:** ${context.sha.substring(0, 8)}\n`;
          summary += `**Time:** ${timestamp}\n\n`;
          summary += `### Deployment Status\n\n`;
          summary += `| Region | Status |\n`;
          summary += `|--------|--------|\n`;
          
          // Matrix job results are a bit different, so we'll check the overall result
          const overallResult = deployments.result;
          const regions = ['Paris', 'Ohio', 'Tokyo', 'Singapore'];
          
          regions.forEach(region => {
            const emoji = overallResult === 'success' ? '✅' : '❌';
            summary += `| ${region} | ${emoji} ${overallResult} |\n`;
          });
          
          // Add to job summary
          await core.summary
            .addRaw(summary)
            .write();